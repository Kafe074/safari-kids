# ─── Configuración compartida (Railway / producción por defecto) ───────────────
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/safari_kids}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

app.jwt.secret=${JWT_SECRET:SafariKids$SecretJWT#2024!XyZ987654321Ab}
app.jwt.expiration=86400000

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# ─── Correo (Gmail SMTP) ────────────────────────────────────────────────────────
# Sin MAIL_USERNAME/MAIL_PASSWORD el envío se omite sin romper la app.
# MAIL_PASSWORD debe ser una "contraseña de aplicación" de Gmail (no la normal):
# https://myaccount.google.com/apppasswords  (requiere verificación en 2 pasos activa)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Para puerto 465 (SSL directo): en Railway pon MAIL_PORT=465 y MAIL_SSL=true.
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL:false}
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:smtp.gmail.com}
# Timeouts (ms): sin esto JavaMail espera indefinidamente si el hosting bloquea el puerto,
# dejando hilos y sockets colgados hasta agotar el pool y "tumbar" la app.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.from-name=${MAIL_FROM_NAME:Safari Kids}
# Envío por API HTTP (Brevo) — necesario en Railway, que bloquea los puertos SMTP.
# Si BREVO_API_KEY está seteada se usa Brevo (puerto 443); si no, se cae a SMTP.
# El remitente sigue siendo MAIL_USERNAME (tu Gmail, verificado como remitente en Brevo).
brevo.api-key=${BREVO_API_KEY:}

# ─── Telegram (avisos internos al personal) ─────────────────────────────────────
# Sin TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID los avisos se omiten sin romper la app.
# 1. Crea un bot con @BotFather y copia el token en TELEGRAM_BOT_TOKEN.
# 2. Agrega el bot al grupo del equipo (o inicia chat con él) y pon el id en TELEGRAM_CHAT_ID.
telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
telegram.chat-id=${TELEGRAM_CHAT_ID:}

logging.level.com.safarikids=INFO
logging.level.org.springframework.security=INFO
