# ── Server ───────────────────────────────────────────────────────────────────
server.port=8080

# ── DataSource ────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/safari_kids?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=0711
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── JWT ───────────────────────────────────────────────────────────────────────
app.jwt.secret=SafariKids2024SecretKeyMuyLargaParaHS256AlgoritmoDeSeguridad!
app.jwt.expiration=86400000

# ── CORS ─────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:5173

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.safarikids=DEBUG
logging.level.org.springframework.security=INFO
